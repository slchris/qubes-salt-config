#
# Pinned inputs for the agent build pipeline. This is the single source of
# truth for "which agent versions does tpl-agents contain"; the build qube
# resolves nothing at build time except what is written here.
#
# scripts/bump_agents.py is the writer for the versions below. It opens a
# pull request; it does not install anything. Rollback is the previous lock,
# then agents.build.run and agents.deliver. The old bundle stays in
# {bundle_dir} and the old version directories stay in /opt/agents-bundle.
#
# Resolve current versions with:
#   npm view <package> version
#   curl -fsSL https://downloads.claude.ai/claude-code/apt/stable/dists/stable/main/binary-amd64/Packages
#   curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt

node:
  version: "22.23.4"
  url: "https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz"
  sha256: "1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce"

agents:
  # Claude Code publishes a signed apt repo; we fetch the exact .deb instead
  # of adding the repo to the template, so the template stays offline and the
  # version is pinned by the digest recorded here. The package is installed
  # with dpkg in tpl-agents.
  claude-code:
    method: deb
    version: "2.1.309-1"
    url: "https://downloads.claude.ai/claude-code/apt/stable/pool/main/c/claude-code/claude-code_2.1.309-1_amd64.deb"
    sha256: "6911afbed733a8b4320cce2208f3f8aa5400c3d8baa438b72cf27a8d53dbd5a5"
    bin: claude

  # The remaining agents are installed into a versioned npm prefix inside the
  # bundle. Their platform binaries are fetched by npm in the build qube (which
  # has the build NetVM); the template never runs npm.
  codex:
    method: npm
    package: "@openai/codex"
    version: "0.166.0"
    bin: codex

  opencode:
    method: npm
    package: "@opencode/cli"
    version: "2.2.5"
    bin: opencode

  pi:
    method: npm
    package: "@earendil-works/pi-coding-agent"
    version: "1.4.0"
    bin: pi
    # pi's npm docs recommend --ignore-scripts for global installs.
    ignore_scripts: true

  grok:
    method: npm
    package: "@xai-official/grok"
    version: "1.0.70"
    bin: grok

# GUI applications installed into tpl-agents from the same verified bundle.
# They are pinned .debs; dependencies are resolved by apt inside the template
# when the bundle is installed. `desktop_file` feeds the Qubes app-menu
# whitelist in agents.template.create. Claude Desktop is the official Linux
# beta; Chrome and VS Code are the vendor .debs.
gui_apps:
  claude-desktop:
    method: deb
    version: "4.4212.0"
    url: "https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_4.4212.0_amd64.deb"
    sha256: "4fcf658e0fc895390ab82593287281dfbce261b0ec3ea90060e82d8bfbfd7a84"
    desktop_file: "com.anthropic.Claude.desktop"

  google-chrome:
    method: deb
    version: "156.0.8078.79-1"
    url: "https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_156.0.8078.79-1_amd64.deb"
    sha256: "be1a1e161419f5c8272432f6860912550d8e29985e925913fa800493a0d0c955"
    desktop_file: "google-chrome.desktop"

  vscode:
    method: deb
    version: "1.144.0-1793133881"
    url: "https://packages.microsoft.com/repos/code/pool/main/c/code/code_1.144.0-1793133881_amd64.deb"
    sha256: "b8fbff92d8d95908990eed0acf004c980f29003725469e794ddbd017ea511a20"
    desktop_file: "com.microsoft.VSCode.desktop"

# CLI tools installed into tpl-agents by agents.template.tools.
# gh, kubectl, kustomize, and age come from Debian and are not pinned here.
# Helm stays on 3.x. The upstream apt repo also publishes Helm 4.
tools:
  helm:
    version: "3.22.0"
    apt_version: "3.22.0-1"
  sops:
    version: "3.13.3"
    url: "https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64"
    sha256: "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
