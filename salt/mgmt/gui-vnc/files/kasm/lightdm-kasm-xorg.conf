# Install this as
# /etc/systemd/system/lightdm.service.d/60-kasm-xorg.conf. It regenerates the
# dummyqbs Xorg config at every display-manager start without requiring the
# retired guivm-vnc/x11vnc service.
[Service]
ExecStartPre=/usr/local/libexec/qubes-kasm-xorg-conf
